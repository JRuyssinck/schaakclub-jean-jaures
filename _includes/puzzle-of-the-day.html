<div class="puzzle" data-lang="{{ page.lang | default: "nl" }}">
  <h2>{% if page.lang == 'en' %}Position of the day{% else %}Stelling van de dag{% endif %}</h2>
  <div class="chessboard" id="puzzle-board" role="img" aria-label="{% if page.lang == 'en' %}Chess position{% else %}Schaakstelling{% endif %}"></div>
  <p class="puzzle-caption" id="puzzle-caption"></p>
  <button type="button" class="button" id="puzzle-reveal">{% if page.lang == 'en' %}Show solution{% else %}Toon oplossing{% endif %}</button>
  <p class="puzzle-solution" id="puzzle-solution" hidden></p>
</div>
<script type="application/json" id="puzzle-data">{{ site.data.puzzles | jsonify }}</script>
<script src="{{ "/assets/js/puzzle-of-the-day.js" | relative_url }}"></script>
