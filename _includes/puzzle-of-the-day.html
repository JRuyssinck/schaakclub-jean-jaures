<div class="puzzle"
     data-lang="{{ page.lang | default: 'nl' }}"
     data-piece-base="{{ '/assets/img/chesspieces/wikipedia/' | relative_url }}">
  <h2>{% if page.lang == 'en' %}Puzzle of the day{% else %}Puzzel van de dag{% endif %}</h2>
  <div id="puzzle-board" class="puzzle-board"></div>
  <p class="puzzle-status" id="puzzle-status" aria-live="polite"></p>
  <p class="puzzle-controls">
    <button type="button" class="button" id="puzzle-reset" hidden>{% if page.lang == 'en' %}Retry{% else %}Opnieuw{% endif %}</button>
  </p>
  <p class="puzzle-credit">{% if page.lang == 'en' %}Daily puzzle via{% else %}Dagelijkse puzzel via{% endif %} <a href="https://lichess.org/training" rel="noopener">lichess.org</a></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js" integrity="sha512-WfASs5HtTgTL/eZsLaOftSN9wMQl7WZGlU5UiKx/yxTViMfGh9whWRwKAC27qH8VtZJqSMqDdbq2uUb1tY3jvQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="{{ '/assets/js/puzzle-of-the-day.js' | relative_url }}"></script>
