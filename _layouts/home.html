---
layout: default
---
<section class="hero">
  <img src="{{ "/assets/img/logo/jeanjaures_logo_small.gif" | relative_url }}" alt="" class="hero-logo">
  <h1>{{ page.title }}</h1>
  <p class="tagline">{{ page.tagline }}</p>
  {% if page.cta_text and page.cta_url %}
  <p class="hero-cta">
    <a class="button" href="{{ page.cta_url | relative_url }}">{{ page.cta_text }}</a>
  </p>
  {% endif %}
</section>
<div class="container home-content">
  {{ content }}
</div>
